<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Luisa ❤️</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient-top: #1d0207;
            --bg-gradient-bottom: #000000;
            --primary-color: #ff4d4d;
            --text-color-light: #ffffff;
            --modal-bg: #0f0c29;
            --image-border: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100%; min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to bottom, var(--bg-gradient-top), var(--bg-gradient-bottom));
            background-attachment: fixed; color: var(--text-color-light);
            overflow-x: hidden;
        }

        /* --- PANTALLAS Y TRANSICIONES --- */
        .screen {
            min-height: 100vh; width: 100%;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            position: absolute; top: 0; left: 0;
        }
        .hidden-screen { opacity: 0; pointer-events: none; transform: scale(0.95); z-index: 0; }
        .active-screen { opacity: 1; pointer-events: auto; transform: scale(1); z-index: 1; position: relative; }

        /* --- PANTALLA PRINCIPAL (LANDING) --- */
        .landing-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 20px;
        }
        .landing-content h1 {
            font-family: 'Dancing Script', cursive; font-size: 5rem;
            text-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 40px var(--primary-color);
            margin-bottom: 20px; animation: float 3s ease-in-out infinite;
        }
        .landing-content p { font-size: 1.3rem; max-width: 600px; line-height: 1.6; margin-bottom: 40px; opacity: 0.9; }
        .btn-entrar {
            background: transparent; color: var(--primary-color); font-family: 'Montserrat', sans-serif;
            font-weight: 600; font-size: 1.2rem; padding: 15px 40px;
            border: 2px solid var(--primary-color); border-radius: 30px; cursor: pointer;
            text-transform: uppercase; transition: all 0.3s ease;
        }
        .btn-entrar:hover { background: var(--primary-color); color: var(--text-color-light); transform: translateY(-3px); }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

        /* --- GALERÍA DE CARTAS --- */
        .header { text-align: center; padding: 60px 20px 20px 20px; }
        .header h2 { font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: var(--primary-color); margin-bottom: 10px; }
        .cards-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        
        .card-item {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px;
            width: 250px; height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.4s ease; position: relative; overflow: hidden;
            opacity: 0; transform: translateY(30px);
        }
        .card-item.show { opacity: 1; transform: translateY(0); }
        .card-item::before { content: '💌'; font-size: 3rem; opacity: 0.15; position: absolute; transition: all 0.4s ease; }
        .card-item:hover { transform: translateY(-10px) scale(1.05); border-color: var(--primary-color); box-shadow: 0 15px 30px rgba(255, 77, 77, 0.3); }
        .card-item:hover::before { opacity: 0.4; font-size: 4rem; }
        .card-item span { font-family: 'Dancing Script', cursive; font-size: 2.2rem; z-index: 1; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
        .card-item small { font-size: 0.85rem; margin-top: 10px; z-index: 1; opacity: 0.7; text-transform: uppercase; }

        /* --- MODAL ESTÁNDAR --- */
        .modal-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; backdrop-filter: blur(5px);
        }
        .modal-container.active { opacity: 1; pointer-events: auto; }
        
        .modal-content-std {
            background-color: var(--modal-bg); padding: 40px 50px; border-radius: 30px;
            max-width: 900px; width: 90%; position: relative; overflow: hidden;
            --c1: #00416a; --c2: #e4e5e6; --c3: #799f0c; --glow: rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px var(--glow);
        }
        
        .modal-content-std::before {
            content: ''; position: absolute; z-index: -1; top: -100%; left: -100%; width: 300%; height: 300%;
            background: linear-gradient(-45deg, var(--modal-bg), var(--c1), var(--c2), var(--c3));
            animation: gradientBg 15s ease infinite;
        }
        
        @keyframes gradientBg { 0% { transform: translate(0, 0); } 50% { transform: translate(5%, 5%); } 100% { transform: translate(0, 0); } }

        .close-button {
            position: absolute; top: 15px; right: 25px; font-size: 2.5rem; color: #fff;
            cursor: pointer; transition: all 0.3s; z-index: 50;
        }
        .close-button:hover { transform: rotate(90deg) scale(1.2); color: var(--primary-color); }
        
        .modal-body { display: flex; align-items: center; gap: 40px; max-height: 60vh; overflow-y: auto; padding-right: 10px; }
        .text-content { text-align: center; flex: 1; }
        .text-content h1 { font-family: 'Dancing Script', cursive; font-size: 3.2rem; margin-bottom: 25px; text-shadow: 0 0 20px var(--glow); }
        .text-content p { font-size: 1.15rem; line-height: 1.7; margin-bottom: 20px; white-space: pre-line; }
        .text-content .signature { font-family: 'Dancing Script', cursive; font-size: 1.8rem; margin-top: 30px; display: block; }
        
        .image-content { flex-shrink: 0; }
        .image-content img {
            max-width: 350px; width: 100%; border-radius: 15px;
            border: 3px solid var(--image-border); object-fit: cover; box-shadow: 0 0 25px var(--glow);
        }

        /* --- ANIMACIÓN ÁRBOL Y CARTA DE OSCAR --- */
        #modalTreeContainer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #07051a, #1a0b1c, #000000);
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
        }
        #modalTreeContainer.active { opacity: 1; pointer-events: auto; }
        
        #treeCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; display: block;
        }

        .glass-letter {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -40%) scale(0.95);
            width: 90%; max-width: 700px;
            max-height: 85vh; /* Limita la altura para que encaje en pantalla */
            overflow-y: auto; /* Activa el scroll si el contenido es largo */
            background: rgba(15, 12, 41, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 40px 50px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 77, 77, 0.2);
            opacity: 0; pointer-events: none;
            transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center; z-index: 10;
        }

        /* Barra de scroll personalizada para la carta de cristal */
        .glass-letter::-webkit-scrollbar {
            width: 6px;
        }
        .glass-letter::-webkit-scrollbar-track {
            background: transparent;
        }
        .glass-letter::-webkit-scrollbar-thumb {
            background: rgba(255, 77, 77, 0.4);
            border-radius: 10px;
        }

        .glass-letter.show-letter {
            opacity: 1; pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .glass-letter h1 {
            font-family: 'Dancing Script', cursive; font-size: 3.5rem;
            color: #ff4d4d; margin-bottom: 25px; text-shadow: 0 0 20px rgba(255, 77, 77, 0.8);
        }

        /* ESTILO PARA LA IMAGEN EN LA CARTA DE OSCAR */
        .glass-letter img {
            max-width: 280px; width: 100%; border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 77, 77, 0.3);
            margin-bottom: 20px; object-fit: cover;
        }

        .glass-letter p {
            font-family: 'Montserrat', sans-serif; font-size: 1.1rem; line-height: 1.8;
            color: #fff; white-space: pre-line; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .glass-letter .signature {
            font-family: 'Dancing Script', cursive; font-size: 2.2rem;
            color: #ff4d4d; display: block; margin-top: 35px; text-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
        }

        @media (max-width: 850px) {
            .modal-body { flex-direction: column; gap: 25px; }
            .image-content { order: -1; }
            .image-content img { max-width: 250px; }
            .glass-letter { padding: 30px 20px; max-height: 80vh; }
            .glass-letter h1 { font-size: 2.5rem; }
            .glass-letter img { max-width: 220px; }
        }
    </style>
</head>
<body>

    <div id="landingScreen" class="screen active-screen">
        <div class="landing-content">
            <h1>Para Luisa</h1>
            <p>Hay muchas personas en este universo que quieren decirte algo especial hoy. Hemos reunido todos estos mensajes en un solo lugar para ti.</p>
            <button id="btnEntrar" class="btn-entrar">Descubrir Mensajes</button>
        </div>
    </div>

    <div id="galleryScreen" class="screen hidden-screen">
        <div class="header">
            <h2>Todos los que te queremos</h2>
            <p>Selecciona una carta para abrirla</p>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- MODAL ESTÁNDAR -->
    <div id="modalStandard" class="modal-container">
        <div id="modalBox" class="modal-content-std">
            <span class="close-button" onclick="closeModals()">×</span>
            <div class="modal-body">
                <div class="text-content">
                    <h1 id="modalTitle">TÍTULO</h1>
                    <p id="modalText">Texto</p>
                    <span class="signature" id="modalSignature">Firma</span>
                </div>
                <div class="image-content">
                    <img id="modalImage" src="" alt="Imagen">
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ESPECIAL OSCAR -->
    <div id="modalTreeContainer">
        <canvas id="treeCanvas"></canvas>
        <div class="glass-letter" id="oscarGlassLetter">
            <span class="close-button" style="top: 15px; right: 25px;" onclick="closeTreeModal()">×</span>
            <h1 id="oscarTitle">TÍTULO</h1>
            
            <!-- IMAGEN DE OSCAR AQUÍ -->
            <img id="oscarImage" src="" alt="Nuestra foto">
            
            <p id="oscarText">Texto</p>
            <span class="signature" id="oscarSignature">Firma</span>
        </div>
    </div>

    <script>
        // BASE DE DATOS DE CARTAS
        const cartasData = [
            {
                id: 1, 
                author: "Oscar",
                title: "BAILA CONMIGO EL BAILE DE LA VIDA",
                text: "Pensé que lo más hermoso que podía contemplar era el cielo estrellado de una noche oscura, hasta que descubrí constelaciones enteras latiendo en tu mirada, incluso a plena luz del día. Desde entonces, alzar la vista al cielo ya no tiene el mismo significado: el único universo que me atrapa y me deja sin palabras es el tuyo.\n\nNo sé si este pensamiento constante nace de tu ausencia en mi realidad o de lo mucho que habitas en mis sueños, pero tengo la certeza de que cada palabra que te escribo es un acierto. Al cerrar los ojos, la oscuridad no existe; el resplandor de tu alma ilumina cada rincón de la mía.",
                signature: "Te amo, Luisa ❤️",
                image: "NOSOTROS.jpg" 
            },
            {
                id: 2,
                author: "Mamá",
                title: "MI LUZ BRILLANTE",
                text: "Desde el primer día que llegaste a mi vida, supe que eras alguien especial. \n\nNo importa cuánto crezcas o a dónde vayas, siempre estaré aquí para apoyarte en cada paso que des. Me haces sentir la persona más afortunada del mundo.",
                signature: "Con todo mi amor, Mamá 🌸",
                image: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=400&q=80",
                theme: { c1: "#00416a", c2: "#e4e5e6", c3: "#799f0c", glow: "rgba(121, 159, 12, 0.8)" }
            },
            {
                id: 3,
                author: "Amigos",
                title: "NUESTRA PERSONA FAVORITA",
                text: "De todas las casualidades de la vida, conocerte fue nuestra favorita.\n\nGracias por estar en los peores momentos y por reír con nosotros hasta que nos duele el estómago en los mejores. Eres increíble.",
                signature: "Tu familia elegida ✨",
                image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80",
                theme: { c1: "#ffb347", c2: "#ffcc33", c3: "#ff7b00", glow: "rgba(255, 179, 71, 0.8)" }
            }
        ];

        document.getElementById('btnEntrar').addEventListener('click', () => {
            document.getElementById('landingScreen').classList.replace('active-screen', 'hidden-screen');
            setTimeout(() => {
                document.getElementById('galleryScreen').classList.replace('hidden-screen', 'active-screen');
                document.querySelectorAll('.card-item').forEach((card, i) => {
                    setTimeout(() => card.classList.add('show'), i * 150);
                });
            }, 800);
        });

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            cartasData.forEach(carta => {
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `<span>De: ${carta.author}</span><small>Haz clic para abrir</small>`;
                card.addEventListener('click', () => openModal(carta));
                grid.appendChild(card);
            });
        }

        function openModal(carta) {
            document.body.style.overflow = 'hidden'; 

            if (carta.id === 1) {
                document.getElementById('oscarTitle').textContent = carta.title;
                document.getElementById('oscarImage').src = carta.image;
                document.getElementById('oscarText').textContent = carta.text;
                document.getElementById('oscarSignature').textContent = carta.signature;
                
                document.getElementById('modalTreeContainer').classList.add('active');
                initTreeAnimation(); 

            } else {
                document.getElementById('modalTitle').textContent = carta.title;
                document.getElementById('modalText').textContent = carta.text;
                document.getElementById('modalSignature').textContent = carta.signature;
                document.getElementById('modalImage').src = carta.image;

                const box = document.getElementById('modalBox');
                box.style.setProperty('--c1', carta.theme.c1);
                box.style.setProperty('--c2', carta.theme.c2);
                box.style.setProperty('--c3', carta.theme.c3);
                box.style.setProperty('--glow', carta.theme.glow);

                box.style.transform = 'scale(0.8)';
                setTimeout(() => box.style.transform = 'scale(1)', 50);

                document.getElementById('modalStandard').classList.add('active');
            }
        }

        function closeModals() {
            document.getElementById('modalStandard').classList.remove('active');
            document.body.style.overflow = 'auto';
            setTimeout(() => document.getElementById('modalImage').src = '', 400);
        }

        function closeTreeModal() {
            document.getElementById('modalTreeContainer').classList.remove('active');
            document.getElementById('oscarGlassLetter').classList.remove('show-letter');
            document.body.style.overflow = 'auto';
            cancelAnimationFrame(treeAnimationId); 
        }

        renderCards();

        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');
        let allBranches = [];
        let allHearts = [];
        let frameCount = 0;
        let treeAnimationId;

        class Heart {
            constructor(x, y, delay) {
                this.x = x; this.y = y; this.delay = delay;
                this.size = 0;
                this.targetSize = Math.random() * 0.8 + 0.6; 
                this.falling = Math.random() > 0.8;
                this.vy = Math.random() * 1 + 0.5; 
                this.vx = (Math.random() - 0.5) * 1;
                this.sway = Math.random() * Math.PI * 2; 
            }
            draw() {
                if (frameCount < this.delay) return; 
                
                if (this.size < this.targetSize) {
                    this.size += 0.03;
                } else if (this.falling) {
                    this.y += this.vy;
                    this.x += Math.sin(this.sway) * 0.5;
                    this.sway += 0.05;
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.size, this.size);
                
                ctx.fillStyle = '#ff2a55';
                ctx.shadowColor = '#ff2a55';
                ctx.shadowBlur = 15;
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(0, -3, -5, -3, -5, 0);
                ctx.bezierCurveTo(-5, 3, 0, 5, 0, 7);
                ctx.bezierCurveTo(0, 5, 5, 3, 5, 0);
                ctx.bezierCurveTo(5, -3, 0, -3, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        function generateTreeData(x, y, angle, len, width, depth, delay) {
            let branch = { x, y, angle, len, width, currentLen: 0, delay };
            allBranches.push(branch);
            
            if (depth > 0) {
                let endX = x + Math.cos(angle) * len;
                let endY = y + Math.sin(angle) * len;
                
                generateTreeData(endX, endY, angle - 0.3 - Math.random()*0.2, len * (0.75 + Math.random()*0.1), width * 0.7, depth - 1, delay + 20);
                generateTreeData(endX, endY, angle + 0.3 + Math.random()*0.2, len * (0.75 + Math.random()*0.1), width * 0.7, depth - 1, delay + 20);
                
                if (Math.random() > 0.4) {
                    generateTreeData(endX, endY, angle + (Math.random()-0.5)*0.3, len * 0.6, width * 0.6, depth - 1, delay + 20);
                }
            } else {
                let endX = x + Math.cos(angle) * len;
                let endY = y + Math.sin(angle) * len;
                let numHearts = Math.floor(Math.random() * 3) + 2; 
                for(let i = 0; i < numHearts; i++) {
                    let hx = endX + (Math.random() - 0.5) * 20;
                    let hy = endY + (Math.random() - 0.5) * 20;
                    allHearts.push(new Heart(hx, hy, delay + 10 + Math.random()*20));
                }
            }
        }

        function initTreeAnimation() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            allBranches = [];
            allHearts = [];
            frameCount = 0;
            
            let isMobile = window.innerWidth < 600;
            let startLen = isMobile ? 100 : 160;
            let startWidth = isMobile ? 12 : 18;
            let startY = isMobile ? canvas.height : canvas.height + 20;
            
            generateTreeData(canvas.width / 2, startY, -Math.PI / 2, startLen, startWidth, 6, 0);
            
            cancelAnimationFrame(treeAnimationId);
            animateTree();
        }

        function animateTree() {
            ctx.fillStyle = 'rgba(7, 5, 26, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.lineCap = 'round';
            
            allBranches.forEach(b => {
                if (frameCount >= b.delay) {
                    if (b.currentLen < b.len) {
                        b.currentLen += 2.5; 
                    }
                    let endX = b.x + Math.cos(b.angle) * b.currentLen;
                    let endY = b.y + Math.sin(b.angle) * b.currentLen;
                    
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.lineTo(endX, endY);
                    ctx.lineWidth = b.width;
                    ctx.strokeStyle = '#e6a8d7';
                    ctx.shadowColor = '#ff6b9e';
                    ctx.shadowBlur = 10;
                    ctx.stroke();
                }
            });

            allHearts.forEach(h => h.draw());

            frameCount++;
            
            if (frameCount === 180) {
                document.getElementById('oscarGlassLetter').classList.add('show-letter');
            }

            treeAnimationId = requestAnimationFrame(animateTree);
        }

        window.addEventListener('resize', () => {
            if(document.getElementById('modalTreeContainer').classList.contains('active')){
                initTreeAnimation();
            }
        });
    </script>
</body>
</html>
